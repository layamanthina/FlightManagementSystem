# ============================================================
# booking-service — Test Profile Configuration
# Active when: @ActiveProfiles("test") or spring.profiles.active=test
# Replaces MySQL with H2 in-memory database for CI/CD
# ============================================================

# H2 in-memory datasource — no MySQL required
spring.datasource.url=jdbc:h2:mem:booking_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Create schema from entities, drop after test
spring.jpa.hibernate.ddl-auto=create-drop

# Disable SQL logging noise in tests
spring.jpa.show-sql=false

# Disable Eureka registration during tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Disable Feign clients from trying to connect during context load
spring.cloud.openfeign.enabled=false
