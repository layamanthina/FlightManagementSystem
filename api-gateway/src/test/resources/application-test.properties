# ============================================================
# api-gateway — Test Profile Configuration
# No database — only disable Eureka and set JWT secret
# ============================================================

# Disable Eureka registration during tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# JWT config for tests
jwt.secret=flightmanagementsystemsecurejwtsecretkey123456789

# Disable gateway routes from resolving during context load
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:9999
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:9999
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:9999
