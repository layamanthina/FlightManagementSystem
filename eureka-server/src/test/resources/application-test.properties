# ============================================================
# eureka-server — Test Profile Configuration
# Disable self-registration so context loads without network
# ============================================================

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Exclude Eureka server auto-configuration (requires ApplicationInfoManager not available with disabled client)
spring.autoconfigure.exclude=org.springframework.cloud.netflix.eureka.server.EurekaServerAutoConfiguration
